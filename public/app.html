async function addP(id){const a=+$("pa").value,r=$("ptp").value==="Refund";if(!(a>0)){toast("Enter an amount");return}const b=find(id);

 const p={d:$("pdt").value||iso(TD),a,m:$("pm").value};if(r)p.r=1;const ps=(b.pays||[]).concat([p]);
 if(await wr(bpath(b),{pays:ps},"update")){logA(`${r?"Refund":"Payment"} ${fmt(a)} · ${b.name}`);setTimeout(()=>{b.pays=ps;rcpt(id,ps.length-1)},250)}}
async function dp(id,i){const b=find(id);if(S.del!=="p"+i){S.del="p"+i;setTimeout(()=>{S.del=null},2500);payS(id);return}S.del=null;const ps=(b.pays||[]).slice(),x=ps.splice(i,1)[0];if(await wr(bpath(b),{pays:ps},"update")){logA(`Removed ${x.r?"refund":"payment"} ${fmt(x.a)} · ${b.name}`);b.pays=ps;payS(id)}}
async function ai1(id){const b=find(id),d=$("id1").value,a=+$("ia").value;if(!d||!(a>0)){toast("Enter due date and amount");return}

async function di(id,i){const b=find(id),arr=insSt(b).map(x=>({d:x.d,a:x.a}));arr.splice(i,1);if(await wr(bpath(b),{ins:arr},"update")){b.ins=arr;payS(id)}}
async function spl(id){const b=find(id),n=Math.max(1,Math.min(24,parseInt($("isn").value)||0)),f=$("isd").value,bal=b.total-paid(b);if(!f||bal<=0){toast("Enter a first due date (balance must be above zero)");return}
 const base=pd(f),amt=Math.floor(bal/n),arr=[];for(let k=0;k<n;k++){const x=new Date(base.getFullYear(),base.getMonth()+k,base.getDate());arr.push({d:iso(x),a:k===n-1?bal-amt*(n-1):amt})}
 const o={ins:arr,ib:Math.max(0,paid(b))};if(await wr(bpath(b),o,"update")){Object.assign(b,o);toast("Installments created");payS(id)}}

 const t=`*${AGY.name}*\n${T} ${no}\nClient: ${b.name}\nPackage: ${b.pkg} (${b.persons} pax)\n${p.r?"Refunded":"Received"}: ${fmt(p.a)} via ${p.m} on ${fd(p.d)}\nTotal: ${fmt(b.total)}\nBalance: ${fmt(bal)}\n${AGY.foot}`;
 const r=(a,c)=>`<div class="rw"><span>${a}</span><b>${c}</b></div>`;

const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=im.width,h=im.height;const m=1100;if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);let q=.7,u=c.toDataURL("image/jpeg",q);while(u.length>260000&&q>.3){q-=.1;u=c.toDataURL("image/jpeg",q)}res(u)};im.src=r.result};r.readAsDataURL(f)});

 try{toast("Saving…");const img=await shrink(f),fid=b.id+"_"+Date.now().toString(36);

 o=o.replace(/\b(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{4})\b/g,(m,d,mo,y)=>d+" "+MON[mo]+" "+y);
